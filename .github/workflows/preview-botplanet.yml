name: Preview BotPlanet

# Uploads a NON-PRODUCTION preview version of the botplanet-web Worker so a
# branch can be reviewed on a real URL before anything is merged.
#
# This workflow deliberately uses `wrangler versions upload`, NOT `deploy`.
# That uploads a new version and returns a preview URL, but does not shift any
# production traffic — https://botplanet.io keeps serving whatever version is
# currently deployed. Nothing here can change production.
#
# CLOUDFLARE_API_TOKEN comes exclusively from GitHub Actions repository secrets
# and is never printed.

on:
  # Temporary branch-only trigger so this review can produce a Cloudflare
  # preview without changing production. Removed before merge.
  push:
    branches:
      - agent/homepage-visual-and-shell-fixes
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or exact commit SHA to preview"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: preview-botplanet
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: a517d133ccec0093de719211a6694951
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Report the commit being previewed
        run: |
          echo "Previewing $(git rev-parse HEAD)"
          echo "PREVIEW_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Astro production build
        run: npm run build -w @botplanet/web

      - name: Upload preview version (does not touch production)
        id: preview
        shell: bash
        working-directory: apps/web
        run: |
          set -o pipefail
          npx wrangler versions upload 2>&1 | tee /tmp/wrangler-preview.log
          version_id="$(grep -Eo 'Worker Version ID:[[:space:]]+[0-9a-f-]+' /tmp/wrangler-preview.log | tail -1 | awk '{print $NF}')"
          preview_url="$(grep -Eo 'https://[0-9a-z-]+\.[0-9a-z-]+\.workers\.dev' /tmp/wrangler-preview.log | tail -1)"
          echo "version_id=${version_id:-unreported}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${preview_url:-unreported}" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Summary
        run: |
          {
            echo "## BotPlanet preview"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Requested ref | \`${{ inputs.ref }}\` |"
            echo "| Commit | \`${PREVIEW_SHA}\` |"
            echo "| Worker version | \`${{ steps.preview.outputs.version_id }}\` |"
            echo "| Preview URL | ${{ steps.preview.outputs.preview_url }} |"
            echo ""
            echo "Production was not modified — this used \`versions upload\`, not \`deploy\`."
          } >> "$GITHUB_STEP_SUMMARY"
