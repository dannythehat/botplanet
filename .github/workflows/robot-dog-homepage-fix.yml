name: Apply robot dog commerce and homepage links

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/robot-dog-homepage-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update robot dog guide and homepage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          guide = Path('apps/web/src/pages/guides/robot-dog-toys.astro')
          text = guide.read_text(encoding='utf-8')
          old = '''    buyHref: "/robots/companion-robots/joy-for-all-companion-pets/",
    buyLabel: "Read our Joy for All review",
    internalHref: "/guides/robotic-pets-for-elderly/",
    internalLabel: "See our guide to robotic pets for older adults",'''
          new = '''    buyHref: "https://www.amazon.com/s?k=Joy+for+All+Companion+Pet+Dog&tag=botplanet-20",
    buyLabel: "Check Joy for All on Amazon",
    internalHref: "/robots/companion-robots/joy-for-all-companion-pets/",
    internalLabel: "Read our full Joy for All review",'''
          if old not in text:
              raise SystemExit('Joy for All block not found')
          guide.write_text(text.replace(old, new, 1), encoding='utf-8')

          home = Path('apps/web/src/pages/index.astro')
          text = home.read_text(encoding='utf-8')
          marker = '''  </section>\n\n  <section class="botmatch" id="botmatch">'''
          section = '''  </section>\n\n  <section class="robot-dog-feature" aria-labelledby="robot-dog-feature-title">\n    <div class="wrap robot-dog-feature__card">\n      <figure class="robot-dog-feature__media">\n        <img\n          src="/media/hubs/companion/tile.webp"\n          srcset={srcsetFor("/media/hubs/companion/tile.webp")}\n          sizes="(min-width: 1000px) 46vw, 100vw"\n          width="1536"\n          height="1024"\n          alt="Companion robots, including a robot dog, shown together."\n          loading="lazy"\n          decoding="async"\n        />\n      </figure>\n      <div class="robot-dog-feature__copy">\n        <p class="kicker">FEATURED BUYING GUIDE</p>\n        <h2 id="robot-dog-feature-title">Best robot dog toys & AI robot dogs in 2026</h2>\n        <p>\n          From a simple robot puppy for a child to Loona, open-source coding dogs and advanced ROS quadrupeds,\n          our guide compares the options by the kind of buyer they actually suit.\n        </p>\n        <div class="robot-dog-feature__actions">\n          <a class="btn btn--accent btn--lg" href="/guides/robot-dog-toys/">Compare robot dogs</a>\n          <a class="btn btn--quiet btn--lg" href="/robots/companion-robots/">Explore companion robots</a>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class="botmatch" id="botmatch">'''
          if marker not in text:
              raise SystemExit('Homepage insertion point not found')
          text = text.replace(marker, section, 1)

          css_marker = '''  /* ---------- Reviews ---------- */'''
          css = '''  /* ---------- Featured robot-dog buying guide ---------- */\n  .robot-dog-feature { padding: clamp(1.1rem,2.4vw,2rem) 0; }\n  .robot-dog-feature__card {\n    display:grid;\n    grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);\n    gap:clamp(24px,4vw,52px);\n    align-items:center;\n    padding:clamp(1.5rem,4vw,3rem);\n    border:1px solid rgba(200,208,222,.2);\n    border-radius:22px;\n    background:radial-gradient(ellipse at 8% 0%,rgba(143,230,255,.08),transparent 58%),linear-gradient(178deg,#11151b 0%,#0a0d11 62%,#0d1116 100%);\n    box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 26px 60px rgba(0,0,0,.5);\n  }\n  .robot-dog-feature__media { margin:0; overflow:hidden; border:1px solid rgba(200,208,222,.16); border-radius:18px; background:#080b0f; }\n  .robot-dog-feature__media img { display:block; width:100%; height:auto; aspect-ratio:3/2; object-fit:cover; }\n  .robot-dog-feature__copy h2 { margin:0; max-width:16ch; font-size:clamp(32px,4vw,54px); line-height:1.02; letter-spacing:-.045em; }\n  .robot-dog-feature__copy > p:last-of-type { margin:18px 0 0; max-width:58ch; color:var(--text-secondary); font-size:17px; line-height:1.65; }\n  .robot-dog-feature__actions { display:flex; flex-wrap:wrap; gap:12px; margin-top:24px; }\n  @media(max-width:820px){\n    .robot-dog-feature__card{grid-template-columns:1fr}\n    .robot-dog-feature__media{order:-1}\n    .robot-dog-feature__actions .btn{width:100%;justify-content:center}\n  }\n\n  /* ---------- Reviews ---------- */'''
          if css_marker not in text:
              raise SystemExit('Homepage CSS insertion point not found')
          home.write_text(text.replace(css_marker, css, 1), encoding='utf-8')
          PY

      - name: Commit changes and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/robot-dog-homepage-fix.yml
          git add apps/web/src/pages/guides/robot-dog-toys.astro apps/web/src/pages/index.astro
          git commit -m "Add robot dog Amazon and homepage entry point"
          git push origin HEAD:main
