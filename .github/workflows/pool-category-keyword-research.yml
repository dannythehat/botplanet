name: Pool category keyword research

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN POOL CATEGORY KEYWORD RESEARCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pool-seo-page-map

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run DataForSEO research
        run: node scripts/pool-category-keyword-research.mjs
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}

      - name: Commit sanitised results to research branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-output/pool-category-keyword-research.json research-output/pool-category-cost.json
          git commit -m "Record pool category keyword research [skip ci]"
          git push origin HEAD:research/pool-seo-page-map

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: pool-category-keyword-research
          path: research-output/pool-category-*.json
          retention-days: 14
