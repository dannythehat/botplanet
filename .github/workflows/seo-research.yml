name: SEO Research (temporary)

# TEMPORARY research batch for the 13 approved robotic-pool-cleaner pages.
# Credentials come exclusively from GitHub repository secrets and are never printed.
# The script enforces the $2.00 total spend ceiling internally.

on:
  workflow_dispatch:
  push:
    branches:
      - research/pool-seo-page-map
    paths:
      - .github/workflows/seo-research.yml

permissions:
  contents: write

jobs:
  research:
    if: github.ref == 'refs/heads/research/pool-seo-page-map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run capped DataForSEO batch
        shell: bash
        run: |
          mkdir -p research-output
          set -o pipefail
          node scripts/seo-research.mjs 2>&1 | tee research-output/run.log
          if grep -Eq 'HTTP (4|5)[0-9]{2}' research-output/run.log; then
            echo 'DataForSEO returned an HTTP error. Research results are invalid.'
            exit 1
          fi
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}

      - name: Upload sanitised results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-research-results
          path: research-output/
          retention-days: 14

      - name: Record successful run receipt
        if: success()
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const results = JSON.parse(fs.readFileSync('research-output/seo-research-results.json', 'utf8'));
          const receipt = {
            runId: Number(process.env.GITHUB_RUN_ID),
            headSha: process.env.GITHUB_SHA,
            completedAt: new Date().toISOString(),
            totalCostUsd: results.totalCostUsd,
            seedCount: results.seeds,
            volumeRows: results.volume.length,
            difficultyRows: results.difficulty.length,
            relatedRows: results.related.length,
            serpRows: results.serps.length
          };
          fs.mkdirSync('docs/seo', { recursive: true });
          fs.writeFileSync('docs/seo/latest-research-run.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/seo/latest-research-run.json
          git commit -m "Record successful DataForSEO research run [skip ci]"
          git push
