name: SEO Research

# The paid keyword-research batch that every BotPlanet category runs BEFORE a
# page is built. See docs/seo/PRE-BUILD-PROCESS.md for where this sits in the
# sequence and what happens to the output.
#
# This workflow was originally written for the pool category, hardcoded to one
# branch, and deleted after that run. It is permanent now: the research stage
# is not a one-off, it is the gate every category passes through, and a gate
# that has to be rebuilt from git history each time is a gate people skip.
#
# Credentials come exclusively from the GitHub repository secret and are never
# printed. The script enforces the spend ceiling internally and refuses a cap
# above it.
#
# Run it from the Actions tab: pick the category, optionally lower the cap.
# Results arrive as a downloadable artifact — raw API responses never enter git.

on:
  workflow_dispatch:
    inputs:
      category:
        description: "Category slug — must match docs/seo/seeds/<slug>.json"
        required: true
        type: string
      cost_cap:
        description: "Spend cap in USD. Lowers the $2.00 ceiling; cannot raise it."
        required: false
        default: "2.00"
        type: string

permissions:
  contents: read

concurrency:
  # One paid run at a time, ever. Two concurrent runs would spend twice and
  # neither would know about the other's cost.
  group: seo-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    # A JOB-LEVEL CEILING, kept as a genuine safety net — but read the
    # correction below before trusting any story about runs "hanging".
    #
    # THE HANGS ON 6 AUGUST 2026 WERE NOT REAL. Two runs, grill and education,
    # were cancelled by hand after appearing stuck for tens of minutes. The
    # logs show both were progressing normally the whole time: live SERP calls
    # completing every 7-16 seconds, fifteen of twenty done on one and five of
    # twenty on the other when the cancel landed. What was actually broken was
    # the observation — the GitHub jobs API kept serving a cached snapshot with
    # `started_at` frozen and no step advancing, and that was read as evidence
    # of a wedge instead of as a stale response.
    #
    # The lesson is about diagnosis rather than timeouts: a status endpoint
    # that never changes is as likely to be lying as the job is to be dead, and
    # the job log settles it. Prefer the log.
    #
# RAISED FROM 15 TO 40 ON 6 AUGUST 2026, and the reason given at the time
    # was WRONG. Correcting it here rather than deleting it, because the wrong
    # diagnosis is the useful part.
    #
    # What was claimed: that `timeout-minutes` counts from job creation, so a
    # queued job burns its own timeout. What actually happened: runs
    # 31120094738 and 31121016884 were BOTH cancelled at exactly 15:01, both
    # with runner_id 0 and runner_name empty, and NEITHER produced a log at all
    # — the logs endpoint 404s, which it does not do for a job that started.
    # The second of those ran against a commit that already carried
    # timeout-minutes: 40, and it died at fifteen minutes anyway.
    #
    # So the ceiling is not ours. No hosted runner was ever assigned. That is a
    # GitHub-side availability or entitlement problem — Actions minutes, plan
    # limits or runner capacity — and no change to this file will fix it.
    #
    # DO NOT KEEP RE-TRIGGERING. Two runs have already been burned proving the
    # same point, and a third proves nothing. Check runner availability for the
    # repository first.
    #
    # Forty minutes stays because it is right on its own merits: it bounds a
    # genuine hang while surviving a busy queue, and the real ceilings are
    # inside the script anyway — a $2.00 cost cap it refuses to exceed, and a
    # twelve-minute wall-clock deadline on the run itself.
    #
    # The slowest healthy batch observed is about four and a half minutes.
    #
    # It is safe because the digest, cost summary and artifact upload all run
    # under `if: always()`, which is how two earlier cancelled runs kept the
    # data they had already paid for.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Confirm the seed inventory exists before spending anything
        run: |
          SEED="docs/seo/seeds/${{ inputs.category }}.json"
          if [ ! -f "$SEED" ]; then
            echo "No seed inventory at $SEED."
            echo "The free seed list is written and reviewed BEFORE the paid run — see docs/seo/PRE-BUILD-PROCESS.md."
            exit 1
          fi
          echo "Seed inventory: $SEED"

      - name: Run capped DataForSEO batch
        shell: bash
        run: |
          mkdir -p research-output
          set -o pipefail
          node scripts/seo-research.mjs 2>&1 | tee research-output/run.log
          if grep -Eq 'HTTP (4|5)[0-9]{2}' research-output/run.log; then
            echo 'DataForSEO returned an HTTP error. Research results are invalid.'
            exit 1
          fi
        env:
          DATAFORSEO_BASIC_AUTH: ${{ secrets.DATAFORSEO_BASIC_AUTH }}
          SEO_CATEGORY: ${{ inputs.category }}
          SEO_COST_CAP: ${{ inputs.cost_cap }}

      # The results are in the artifact, which is the right place to store them
      # and a bad place to read them from. Whoever has to turn this run into a
      # keyword map may not be able to download an artifact, and re-running the
      # batch to see the numbers again means paying for them twice. This prints
      # the decision-grade fields into the job log. It spends nothing, and it
      # never fails the run — a digest error must not lose a paid result.
      - name: Print the digest into the log
        if: always()
        continue-on-error: true
        run: node scripts/seo-research-digest.mjs --category=${{ inputs.category }}

      - name: Report what it cost
        if: always()
        run: |
          COST="research-output/${{ inputs.category }}-cost-summary.json"
          [ -f "$COST" ] && cat "$COST" >> "$GITHUB_STEP_SUMMARY" || echo "No cost summary produced." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sanitised results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-research-${{ inputs.category }}
          path: research-output/
          retention-days: 30
