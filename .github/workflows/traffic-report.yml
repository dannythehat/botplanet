name: Traffic Report

# Pulls Cloudflare edge traffic into the repository as a dated markdown file.
#
# WHY IT COMMITS RATHER THAN JUST PRINTING. The point is to answer "is it
# moving?" without anybody opening a dashboard. A run summary answers it once,
# for whoever is looking at that run; a committed file answers it for everyone,
# forever, and lets two dates be diffed against each other.
#
# It runs weekly on Monday morning and on demand. Weekly rather than daily
# because this site's numbers currently move on a scale of weeks, and a daily
# commit of an unchanged file is noise that trains people to ignore the file.
#
# The credential is the existing CLOUDFLARE_API_TOKEN repository secret. It
# needs Zone:Read and Analytics:Read. Nothing is written to the report except
# aggregate figures — no IPs, no user agents beyond the family name Cloudflare
# itself reports.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to report, ending yesterday (1-90)."
        required: false
        default: "14"
        type: string
  schedule:
    # 07:12 UTC on Mondays. Not on the hour: every scheduled workflow on GitHub
    # asks for :00, and runs queued at the top of the hour are the ones that
    # get delayed.
    - cron: "12 7 * * 1"

permissions:
  contents: write

concurrency:
  group: traffic-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pull the numbers
        shell: bash
        run: node scripts/traffic-report.mjs --days="${{ inputs.days || '14' }}" | tee "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Commit the report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/traffic/
          # Nothing to commit is a normal outcome: re-running on the same day
          # rewrites an identical file.
          git diff --cached --quiet && { echo "No change."; exit 0; }
          git commit -q -m "Traffic report, $(date -u +%Y-%m-%d)"
          git push origin HEAD:main
