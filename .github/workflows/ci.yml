name: CI

# Pull-request validation only. Production pushes are already tested by the
# Deploy BotPlanet workflow, so running this suite again on every main push
# only duplicates work and Actions usage.
on:
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Migrations in sync (no schema drift)
        run: |
          npm run db:generate
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Schema drift detected — run 'npm run db:generate' and commit the migration." >&2
            git status --porcelain
            git --no-pager diff
            exit 1
          fi
