name: Pool product keyword research

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'RUN FIVE POOL PRODUCT KEYWORD RESEARCH'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/pool-seo-page-map

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run capped DataForSEO research
        run: node scripts/pool-product-keyword-research.mjs
        env:
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          DATAFORSEO_BASIC_AUTH: ${{ secrets.DATAFORSEO_BASIC_AUTH }}

      - name: Commit sanitised results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research-output/pool-product-keyword-research.json research-output/pool-product-keyword-summary.json
          git commit -m "Record five pool product keyword research [skip ci]"
          git push origin HEAD:research/pool-seo-page-map

      - name: Upload results artifact
        uses: actions/upload-artifact@v4
        with:
          name: pool-product-keyword-research
          path: research-output/pool-product-keyword-*.json
          retention-days: 14
