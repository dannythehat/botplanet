name: Deploy BotPlanet

# Production deployment of the botplanet-web Worker.
# Runs for pushes to main and can also be started manually.
# CLOUDFLARE_API_TOKEN comes exclusively from GitHub Actions repository secrets
# and is never printed. The Cloudflare account ID is non-secret configuration.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-botplanet
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: a517d133ccec0093de719211a6694951
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Astro production build
        run: npm run build -w @botplanet/web

      - name: Deploy botplanet-web Worker
        run: npm run deploy -w @botplanet/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
