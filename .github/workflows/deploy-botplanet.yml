name: Deploy BotPlanet

# Manual production deployment of the botplanet-web Worker.
# Deploys ONLY from main, after the full validation suite passes.
# CLOUDFLARE_API_TOKEN comes exclusively from GitHub secrets and is never
# printed; wrangler reads it from the environment. CLOUDFLARE_ACCOUNT_ID is
# optional — set it as a secret only if the token can see multiple accounts.

on:
  workflow_dispatch:

concurrency:
  group: deploy-botplanet
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Astro production build
        run: npm run build -w @botplanet/web

      - name: Deploy botplanet-web Worker
        run: npm run deploy -w @botplanet/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
